name: Update star badges

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Update star badges in README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import json, math, os, re, subprocess, urllib.parse, urllib.request
          from collections import defaultdict

          result = subprocess.run(
              # archived repos are intentionally INCLUDED — archiving a project
              # should not erase it from the portfolio list
              ["gh", "repo", "list", "GeiserX", "--source",
               "--visibility", "public", "--limit", "200",
               "--json", "name,stargazerCount,primaryLanguage,isArchived"],
              capture_output=True, text=True, check=True
          )
          # Repos deliberately kept out of the Projects list.
          # "GeiserX" is the profile repo itself; add any repo you don't want shown.
          HIDDEN = {
              "GeiserX",
              "claude-code-parallel-skills",  # merged into agent-skills
          }
          repos = [r for r in json.loads(result.stdout) if r["name"] not in HIDDEN]

          STAR_COLOR = "FFD700"
          # The star side of a badge starts at the badge's own colour and moves towards gold as
          # the stars grow. x is the log of the stars over the log of the most-starred repo, so
          # 1 star is 0 and the top repo is 1. An S-curve on x keeps 1-2 stars near the badge
          # colour and puts ~50 stars mostly in gold. STAR_MID is the x that is half gold;
          # STAR_STEEP sets how fast it turns. The mix runs in OKLab, so blue fades straight to
          # gold without passing through some other hue. A new top repo shifts every badge a
          # little towards its own colour, which is the point: gold means "near the top".
          STAR_MID, STAR_STEEP = 0.45, 10.0

          def _lin(c):
              return c / 12.92 if c <= 0.04045 else ((c + 0.055) / 1.055) ** 2.4

          def _unlin(c):
              c = min(1.0, max(0.0, c))
              return 12.92 * c if c <= 0.0031308 else 1.055 * c ** (1 / 2.4) - 0.055

          def _oklab(hexc):
              r, g, b = (_lin(int(hexc[i:i + 2], 16) / 255) for i in (0, 2, 4))
              l = (0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b) ** (1 / 3)
              m = (0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b) ** (1 / 3)
              s = (0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b) ** (1 / 3)
              return (0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
                      1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
                      0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s)

          def _hex(L, a, b):
              l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3
              m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3
              s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3
              rgb = (4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
                     -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
                     -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s)
              return "".join(f"{round(_unlin(c) * 255):02X}" for c in rgb)

          def star_color(count, color, top):
              if top <= 1 or count <= 1:
                  return color
              x = min(1.0, math.log(count) / math.log(top))
              sig = lambda v: 1 / (1 + math.exp(-STAR_STEEP * (v - STAR_MID)))
              t = (sig(x) - sig(0)) / (sig(1) - sig(0))
              base, gold = _oklab(color), _oklab(STAR_COLOR)
              return _hex(*(p + (q - p) * t for p, q in zip(base, gold)))

          TOP_STARS = max((r["stargazerCount"] for r in repos if not r.get("isArchived")), default=1)

          # Archived repos: the name keeps its colour on the left and fades to grey on the right,
          # and the star turns grey and hollow. shields.io cannot draw a gradient, so the badge
          # is fetched once, the fill of its coloured part swapped for a gradient, and saved here.
          ARCHIVED_STAR_COLOR = "555555"
          FADE_DIR = "docs/images/badges"
          os.makedirs(FADE_DIR, exist_ok=True)
          faded = set()

          def fade_badge(name, url, color):
              try:
                  req = urllib.request.Request(urllib.parse.quote(url, safe=":/?&=%+"), headers={"User-Agent": "profile-badges"})
                  svg = urllib.request.urlopen(req, timeout=20).read().decode()
              except Exception as e:
                  print(f"fade: {name}: fetch failed ({e}), using the plain badge")
                  return url
              rect = re.compile(r'<rect ([^>]*?)fill="#%s"/>' % color.lower(), re.I)
              m = rect.search(svg)
              if not m or '<g shape-rendering' not in svg:
                  print(f"fade: {name}: unexpected badge shape, using the plain badge")
                  return url
              svg = svg[:m.start()] + f'<rect {m.group(1)}fill="url(#fade)"/>' + svg[m.end():]
              grad = ('<defs><linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">'
                      f'<stop offset=".30" stop-color="#{color}"/><stop offset="1" stop-color="#9E9E9E"/>'
                      '</linearGradient></defs>')
              svg = svg.replace('<g shape-rendering', grad + '<g shape-rendering', 1)
              path = f"{FADE_DIR}/{name}.svg"
              with open(path, "w") as f:
                  f.write(svg)
              faded.add(f"{name}.svg")
              return path

