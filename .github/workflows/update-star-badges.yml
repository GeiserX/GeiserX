name: Update star badges

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Update star badges in README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import json, os, re, subprocess, urllib.parse, urllib.request
          from collections import defaultdict

          result = subprocess.run(
              # archived repos are intentionally INCLUDED — archiving a project
              # should not erase it from the portfolio list
              ["gh", "repo", "list", "GeiserX", "--source",
               "--visibility", "public", "--limit", "200",
               "--json", "name,stargazerCount,primaryLanguage,isArchived"],
              capture_output=True, text=True, check=True
          )
          # Repos deliberately kept out of the Projects list.
          # "GeiserX" is the profile repo itself; add any repo you don't want shown.
          HIDDEN = {
              "GeiserX",
              "claude-code-parallel-skills",  # merged into agent-skills
              "geiserx.github.io",  # only a redirect to cv.geiser.cloud now
          }
          repos = [r for r in json.loads(result.stdout) if r["name"] not in HIDDEN]

          STAR_COLOR = "FFD700"
          # Archived repos: the name keeps its colour on the left and fades to grey on the right,
          # and the star turns grey and hollow. shields.io cannot draw a gradient, so the badge
          # is fetched once, the fill of its coloured part swapped for a gradient, and saved here.
          ARCHIVED_STAR_COLOR = "555555"
          FADE_DIR = "docs/images/badges"
          os.makedirs(FADE_DIR, exist_ok=True)
          faded = set()

          def fade_badge(name, url, color):
              try:
                  req = urllib.request.Request(urllib.parse.quote(url, safe=":/?&=%+"), headers={"User-Agent": "profile-badges"})
                  svg = urllib.request.urlopen(req, timeout=20).read().decode()
              except Exception as e:
                  print(f"fade: {name}: fetch failed ({e}), using the plain badge")
                  return url
              rect = re.compile(r'<rect ([^>]*?)fill="#%s"/>' % color.lower(), re.I)
              m = rect.search(svg)
              if not m or '<g shape-rendering' not in svg:
                  print(f"fade: {name}: unexpected badge shape, using the plain badge")
                  return url
              svg = svg[:m.start()] + f'<rect {m.group(1)}fill="url(#fade)"/>' + svg[m.end():]
              grad = ('<defs><linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">'
                      f'<stop offset=".30" stop-color="#{color}"/><stop offset="1" stop-color="#9E9E9E"/>'
                      '</linearGradient></defs>')
              svg = svg.replace('<g shape-rendering', grad + '<g shape-rendering', 1)
              path = f"{FADE_DIR}/{name}.svg"
              with open(path, "w") as f:
                  f.write(svg)
              faded.add(f"{name}.svg")
              return path

          # Official CashPilot mark (app/static/favicon.svg from the CashPilot repo),
          # inlined as a data URI — shields.io has no simple-icons entry for it.
          # '+' is percent-encoded because a bare '+' means space in a query string.
          CASHPILOT_LOGO = "data:image/svg%2Bxml;base64,%2BPHN0b3Agb2Zmc2V0PSIxMDAlIiBzdG9wLWNvbG9yPSIjN0IxRkEyIi8%2BPC9saW5lYXJHcmFkaWVudD48Y2xpcFBhdGggaWQ9InNjIj48Y2lyY2xlIGN4PSIxNiIgY3k9IjE2IiByPSIxMSIvPjwvY2xpcFBhdGg%%2BPC9nPjwvc3ZnPg=="

          # Open book, no cross (biblical-earth is a jw.org-based study tool), inlined the same way.
          BIBLE_LOGO = "data:image/svg%2Bxml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI%"

          # Marks for the other product families, inlined the same way (white on the label colour).
          LYNXPROMPT_LOGO = "data:image/png;base64,%2B/vn5%2BfS0tIHBwcAAABDQ0LJyckFBAUBAQEPDw%2BdnZ0XFxcBAQEBAQEAAABra2tqamp/f38JCQkKCgoCAgIAAAAAAAAkJCQqKiocHBxaWlplZWUKCgoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAgIAAAAAAAAAAACJiYkLCwteXl7FxcX6%2Bvr8/PypqakICAgAAAAGBgYWFhba2tqoqKgBAgKoqakHBwcEBAQMDAwCAgLt7e2jo6MODg5GRkY9PT0BAQEKCgrm5uagoKAJCQkJCAm%2Bvr7W1tdpaWklJSXIyMhzdHNiYmIFBQUpKSlJSUmzs7OGhoaE4j6OAAAAc3RSTlMAAAAAAAAAAAAAAAAAAAA1Lw1SET2oOxKEignC4W0VDBYQCTqv9lYOuvjCttHDrOP4TAKQ3ylT%2BP67h/7%2B/v7qPx3O/v7%2BjDfn/v7%2BuBy3/pIJdf3%2B60Eew%2B/2/e7vcRBR75N9yI9s5JMKCH5bBBkFKmUUPtczGAAAANdJREFUCNdj4BdgYGRkYgQCZkEhYQYRUTEWVjZ2DkZGcQlJKQZxaRlZOXkFRSVlFVU1RgZ1jWJNLW0dXT39EgNDRgYj49Ky8orKquqaWhNTTgYuM/M6C4v6quqGKktBoKyVtY2tXWNTc0urvQMjg6NTm7OLa3tHZ1d3jxsjg7tHr6eXd19LbX/1BB95Bl%2B/iZP8vSZXlUypbQ4IZOAOCp46rWz6jJmzQkLDGBl4wiNmR0bNiY4piY2LZ2Tg5UtITEpOSU1Lz8hkZAS6Pys7Jzcvv6CwCOgNAEfsNqrlH3XtAAAAAElFTkSuQmCC"
          PUMPERLY_LOGO = "data:image/svg%2Bxml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI%2BPHBhdGggZD0iTTIxIDRMOSAxOGg4bC0zIDEwTDI0IDE0aC04bDUtMTB6IiBmaWxsPSJ3aGl0ZSIvPjwvc3ZnPgo="
          GENIEACS_LOGO = "data:image/svg%2Bxml;base64,"
          DUPLICACY_LOGO = "data:image/svg%2Bxml;base64,"

          # ── Badge styles: (color, shields.io logo or None) ──────────────
          GROUP_STYLES = {
              # Product families: the core repo and every integration surface
              # (MCP server, HA integration, n8n node, app, tap, action) in one row.
              "LynxPrompt": ("151515", LYNXPROMPT_LOGO),
              "CashPilot": ("0A0A1A", CASHPILOT_LOGO),
              "Pumperly": ("059669", PUMPERLY_LOGO),
              "Telegram-Archive": ("1F4E79", "telegram"),
              "GenieACS": ("0E7490", GENIEACS_LOGO),
              "Duplicacy": ("6D28D9", DUPLICACY_LOGO),
              # Domains
              "Agents & AI": ("D97757", "claude"),
              "Jellyfin": ("AA5CC3", "jellyfin"),
              "Telegram bots": ("26A5E4", "telegram"),
              "Homelab": ("384d54", "docker"),
              "Networking": ("1F2A44", "tailscale"),
              "Web archiving": ("4A4A4A", "internetarchive"),
              "Data & health": ("276DC3", "r"),
              "Spain": ("AA151B", None),
              "Biblical Earth": ("5C3D1E", BIBLE_LOGO),
              "Awesome": ("FC60A8", "awesomelists"),
              "Older work": ("6E6E6E", "github"),
              # Language fallback: a repo that lands here is missing from ROUTES below.
              "Python": ("3572A5", "python"),
              "TypeScript": ("3178C6", "typescript"),
              "JavaScript": ("f1e05a", "javascript"),
              "Go": ("00ADD8", "go"),
              "Swift": ("F05138", "swift"),
              "Kotlin": ("7F52FF", "kotlin"),
              "Ruby": ("701516", "ruby"),
              "Shell": ("89e051", "gnubash"),
              "C#": ("178600", "dotnet"),
              "R": ("198CE7", "r"),
              "HTML": ("e34c26", "html5"),
              "HCL": ("844FBA", "terraform"),
              "Dockerfile": ("384d54", "docker"),
              "Handlebars": ("f7931e", "handlebarsdotjs"),
              "Java": ("b07219", "openjdk"),
              "Rust": ("dea584", "rust"),
              "C": ("555555", "c"),
              "C++": ("f34b7d", "cplusplus"),
              "Lua": ("000080", "lua"),
              "PHP": ("4F5D95", "php"),
              "Vue": ("4FC08D", "vuedotjs"),
              "Svelte": ("ff3e00", "svelte"),
              "CSS": ("563d7c", "css3"),
              "Jupyter Notebook": ("DA5B0B", "jupyter"),
              "Dart": ("00B4AB", "dart"),
          }
          DEFAULT_STYLE = ("555555", "github")

          # ── Routing: repo → group ──────────────────────────────────────
          # Every public repo is listed here or matched by a family prefix below.
          # A repo that shows up in a language row is one that needs a line here.
          ROUTES = {
              "Agents & AI": [
                  "akou", "unsent", "hark-viewer", "agent-skills", "cc-aws-keepalive",
                  "cc-agents-md", "mcp-upgrade", "homebrew-mcp-upgrade", "epub-and-vtt-to-llm",
                  "spinnaker-mcp", "atlassian-browser-mcp", "homebrew-agenttap", "homebrew-unsent",
                  "AgentTap",
              ],
              "Jellyfin": [
                  "whisper-subs", "smart-covers", "quality-gate", "quality-gate-encoder",
                  "jellyfin-telegram-channel-sync",
              ],
              "Telegram bots": [
                  "telegram-slskd-local-bot", "paperless-telegram-bot", "IBKR-Telegram",
                  "telegram-delay-channel-cloner",
              ],
              "Homelab": [
                  "media-download", "slskd-transform", "qbittorrent-orphaned", "audio-transcode-watcher",
                  "migrate-psql", "gha-deadman", "nginx-mailer", "docker-templates", "runtipi-appstore",
                  "grafana-airgradient-dashboard", "grafana-rightsizing-dashboard", "cloud-tests-velero",
                  "k8s-dockerhub-detector", "redis-operator", "PiSpot-Show", "PiSpot-Watch",
                  "PiSpot-Deployment", "Way-CMS", "n8n-nodes-way-cms",
              ],
              "Networking": [
                  "VPN-Bypass", "homebrew-vpn-bypass", "tailscale-rs", "tailscaled-rs", "router-express",
              ],
              "Web archiving": ["Wayback-Archive", "Wayback-Diff", "web-mirror"],
              "Data & health": [
                  "Personal-Genome-Pipeline", "statix", "search-by-surname",
                  "secciones-nacionalidades", "services-isp",
              ],
              "Spain": ["DeclaRenta", "BuscaPaginasBlancas", "Sanitune", "museopostal", "CatsUp", "homebrew-catsup", "AskePub"],
              "Biblical Earth": ["biblical-earth"],
              "Older work": [
                  "ScriptPoblar", "import-xgest-odoo", "AdamPartsFinder", "WebApp-Flotas", "ePubLangMerger",
                  "Minecraft-Youtube-Follower", "ghost-github-portfolio", "github-toggle-all-details", "cv",
              ],
          }
          NAME_TO_GROUP = {n: g for g, names in ROUTES.items() for n in names}
          # Family prefix anywhere in the name catches the core and every integration:
          # lynxprompt-mcp, homebrew-lynxprompt, n8n-nodes-lynxprompt, CashPilot-android...
          FAMILIES = [
              ("lynxprompt", "LynxPrompt"), ("cashpilot", "CashPilot"), ("pumperly", "Pumperly"),
              ("telegram-archive", "Telegram-Archive"), ("genieacs", "GenieACS"), ("duplicacy", "Duplicacy"),
          ]

          def get_group(repo):
              name = repo["name"]
              if name in NAME_TO_GROUP:
                  return NAME_TO_GROUP[name]
              if name.startswith("awesome-"):
                  return "Awesome"
              low = name.lower()
              for key, group in FAMILIES:
                  if key in low:
                      return group
              lang = repo["primaryLanguage"]["name"] if repo["primaryLanguage"] else None
              return lang or "GitHub"

          # ── Group display order ────────────────────────────────────────
          GROUP_ORDER = [
              "LynxPrompt", "CashPilot", "Pumperly", "Telegram-Archive", "GenieACS", "Duplicacy",
              "Agents & AI", "Jellyfin", "Telegram bots", "Homelab", "Networking", "Web archiving",
              "Data & health", "Spain", "Biblical Earth", "Awesome", "Older work",
          ]

          # ── Group repos ────────────────────────────────────────────────
          groups = defaultdict(list)
          for r in repos:
              groups[get_group(r)].append(r)

          # Sort repos within each group: stars desc, then name asc
          for g in groups:
              groups[g].sort(key=lambda x: (x.get("isArchived", False), -x["stargazerCount"], x["name"].lower()))

          # Build ordered list: fixed order first, then new groups alphabetically
          ordered = []
          seen = set()
          for g in GROUP_ORDER:
              if g in groups:
                  ordered.append((g, groups[g]))
                  seen.add(g)
          for g in sorted(groups.keys()):
              if g not in seen:
                  ordered.append((g, groups[g]))

          def make_badge(repo, group):
              name = repo["name"]
              count = repo["stargazerCount"]
              color, logo = GROUP_STYLES.get(group, DEFAULT_STYLE)
              label = name.replace("-", "--")
              alt = name

              if repo.get("isArchived"):
                  alt = f"{name} (archived)"
              logo_q = f"&logo={logo}&logoColor=white" if logo else ""
              if repo.get("isArchived") and count >= 1:
                  src = f"https://img.shields.io/badge/{label}-☆_{count}-{ARCHIVED_STAR_COLOR}?style=flat-square{logo_q}&labelColor={color}"
              elif count >= 1:
                  src = f"https://img.shields.io/badge/{label}-★_{count}-{STAR_COLOR}?style=flat-square{logo_q}&labelColor={color}"
              else:
                  src = f"https://img.shields.io/badge/{label}-{color}?style=flat-square{logo_q}"

              if repo.get("isArchived") and re.fullmatch(r"[0-9A-Fa-f]{6}", color):
                  src = fade_badge(name, src, color)

              return f'<a href="https://github.com/GeiserX/{name}"><img src="{src}" alt="{alt}"></a>'

          badge_groups = []
          for group, repos_list in ordered:
              badges = [make_badge(r, group) for r in repos_list]
              badge_groups.append("\n".join(badges))

          for stale in set(os.listdir(FADE_DIR)) - faded:
              os.remove(os.path.join(FADE_DIR, stale))

          new_block = "\n<br/>\n".join(badge_groups)

          with open("README.md") as f:
              content = f.read()

          pm = re.search(
              r'(## Projects\s*\n+<p align="center">\n)(.*?)(\n</p>)',
              content, re.DOTALL
          )
          if not pm:
              print("No Projects section found")
              exit(0)

          new_content = content[:pm.start()] + pm.group(1) + new_block + pm.group(3) + content[pm.end():]

          if new_content != content:
              with open("README.md", "w") as f:
                  f.write(new_content)
              print("README updated")
          else:
              print("No changes needed")

      - uses: peter-evans/create-pull-request@v8
        id: create-pr
        with:
          commit-message: "Update star badges"
          title: "Update star badges"
          body: "Automated hourly update of star count badges in profile README."
          branch: automated/star-badges
          delete-branch: true

      - name: Merge PR
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # An explicit subject and body keep GitHub from adding a Co-authored-by trailer to the squash commit.
        run: >-
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --squash --delete-branch
          --subject "Update star badges (#${{ steps.create-pr.outputs.pull-request-number }})"
          --body "Automated update of the star badges in the profile README."
