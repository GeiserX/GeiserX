              "Ghost": ("15171A", "ghost"),
              "Awesome": ("FC60A8", "awesomelists"),
              # Language groups (fallback)
              "Python": ("3572A5", "python"),
              "TypeScript": ("3178C6", "typescript"),
              "JavaScript": ("1A7100", "javascript"),  # deep Node.js green: JS yellow would vanish into the gold stars
              "Go": ("00ADD8", "go"),
              "Swift": ("F05138", "swift"),
              "Kotlin": ("7F52FF", "kotlin"),
              "Ruby": ("701516", "ruby"),
              "Shell": ("89e051", "gnubash"),
              "C#": ("178600", "dotnet"),
              "R": ("198CE7", "r"),
              "HTML": ("e34c26", "html5"),
              "HCL": ("844FBA", "terraform"),
              "Dockerfile": ("384d54", "docker"),
              "Handlebars": ("f7931e", "handlebarsdotjs"),
              "Makefile": ("89e051", "gnu"),
              "Go Template": ("00ADD8", "go"),
              "Java": ("b07219", "openjdk"),
              "Scala": ("c22d40", "scala"),
              "Rust": ("CF9572", "rust"),  # a little darker than GitHub's dea584, so the gold stars stand out
              "C": ("555555", "c"),
              "C++": ("f34b7d", "cplusplus"),
              "Zig": ("F7A41D", "zig"),
              "Haskell": ("5e5086", "haskell"),
              "Elixir": ("6e4a7e", "elixir"),
              "Lua": ("000080", "lua"),
              "Perl": ("0298c3", "perl"),
              "PHP": ("4F5D95", "php"),
              "PowerShell": ("012456", "powershell"),
              "Nix": ("7e7eff", "nixos"),
              "Vue": ("4FC08D", "vuedotjs"),
              "Svelte": ("ff3e00", "svelte"),
              "CSS": ("563d7c", "css3"),
              "SCSS": ("c6538c", "sass"),
              "Astro": ("ff5a03", "astro"),
              "Jupyter Notebook": ("DA5B0B", "jupyter"),
              "Julia": ("9558B2", "julia"),
              "Dart": ("00B4AB", "dart"),
              "Objective-C": ("438eff", "apple"),
              "TeX": ("3D6117", "latex"),
              "Groovy": ("4298b8", "apachegroovy"),
              "Clojure": ("db5855", "clojure"),
              "OCaml": ("3be133", "ocaml"),
              "F#": ("b845fc", "fsharp"),
              "Erlang": ("B83998", "erlang"),
              "ElectroBun": ("111111", "bun"),
          }
          DEFAULT_STYLE = ("555555", "github")

          # ── Routing: repo → group ──────────────────────────────────────
          def get_group(repo):
              name = repo["name"]
              lang = repo["primaryLanguage"]["name"] if repo["primaryLanguage"] else None

              # ─ Product families that take every related repo ─
              # Everything GenieACS, LynxPrompt, Pumperly, CashPilot, VPN Bypass, Radares Anunciados or
              # Duplicacy goes in its product's own group, the MCP server, mobile apps, integrations,
              # taps, containers, actions and any awesome list included.
              if "genieacs" in name.lower():
                  return "GenieACS"
              if "lynxprompt" in name.lower():
                  return "LynxPrompt"
              if "pumperly" in name.lower():
                  return "Pumperly"
              if "cashpilot" in name.lower():
                  return "CashPilot"
              if "vpn-bypass" in name.lower():
                  return "VPN Bypass"
              if "radares-anunciados" in name.lower():
                  return "Radares Anunciados"
              if "duplicacy" in name.lower():
                  return "Duplicacy"
              # The household Telegram bots and their apps (SuperMealPlanner, supermealplanner-ios, ...)
              if name.lower().startswith("super"):
                  return "Super bots"

              # ─ Curated lists ─
              if name.startswith("awesome-"):
                  return "Awesome"

              # ─ Product families (own brand mark) ─
              if name.lower().startswith("biblical-"):
                  return "Biblical Atlas"

              # ─ Topic groups ─
              if name in ("Wayback-Archive", "web-mirror", "media-download", "Way-CMS", "Wayback-Diff"):
                  return "Web Archive"
              if name in ("hark-viewer", "telegram-slskd-local-bot", "akou",
                          "akou-companion", "audio-transcode-watcher", "slskd-transform", "Sanitune"):
                  return "Audio"
              if name in ("Telegram-Archive", "TG-Archive-iOS", "paperless-telegram-bot", "IBKR-Telegram",
                          "telegram-delay-channel-cloner"):
                  return "Telegram"
              if name in ("unsent", "mcp-upgrade"):
                  return "CLI"
              if name in ("gramps-web-toolkit", "search-by-surname", "BuscaPaginasBlancas"):
                  return "Genealogy"
              if name in ("tailscale-rs", "tailscaled-rs", "router-express",
                          "statix", "services-isp"):
                  return "Networking"

              # ─ Platform / ecosystem (checked first, overrides language) ─

              # Grafana
              if name.startswith("grafana-"):
                  return "Grafana"

              # Runtipi
              if name == "runtipi-appstore":
                  return "Runtipi"

              # Unraid
              if name == "docker-templates":
                  return "Unraid"

              # Raspberry Pi / IoT
              if name.startswith("PiSpot-"):
                  return "Raspberry Pi"

              # Jellyfin plugins & tools
              if name in (
                  "whisper-subs", "smart-covers", "quality-gate",
                  "quality-gate-encoder", "jellyfin-telegram-channel-sync",
                  "qbittorrent-orphaned", "vettarr",
              ):
                  return "Jellyfin"

              # MCP servers
              if name.endswith("-mcp"):
                  return "MCP"

              # n8n community nodes
              if name.startswith("n8n-nodes-"):
                  return "n8n"

              # Home Assistant integrations
              if name.endswith("-ha"):
                  return "Home Assistant"

              # Android apps
              if name.endswith("-android"):
                  return "Android"

              # VS Code extensions
              if name.endswith("-vscode"):
                  return "VS Code"

              # Agent Skills (SKILL.md packages for any agent)
              # sstack is Markdown skills; GitHub calls it Python because it counts code, not prose
              if name.endswith("-skills") or name == "sstack":
                  return "Agent Skills"

              # Claude Code plugins
              if name.startswith("cc-") or name.startswith("claude-code-"):
                  return "Claude Code"

              # GitHub Actions
              if name.endswith("-action"):
                  return "GitHub Actions"

              # Homebrew taps
              if name.startswith("homebrew-"):
                  return "Homebrew"

              # Ansible
              if name.endswith("-ansible"):
                  return "Ansible"

              # Docker / Helm containers
              if name.endswith("-container"):
                  return "Docker"

              # Kubernetes tools
              if name in (
                  "redis-operator", "k8s-dockerhub-detector",
                  "cloud-tests-velero",
              ):
                  return "Kubernetes"

              # Browser extensions
              if name == "github-toggle-all-details":
                  return "Browser Extensions"

              # ─ Special overrides ─
              OVERRIDES = {
                  "AgentTap": "ElectroBun",
                  "ghost-github-portfolio": "Ghost",
              }
              if name in OVERRIDES:
                  return OVERRIDES[name]

              # ─ Fallback to primary language ─
              if lang in ("Go Template", "Makefile"):
                  return lang
              return lang or "GitHub"

          # ── Group display order ────────────────────────────────────────
          GROUP_ORDER = [
              # Main products (contrast-ordered by color)
              "Python",                   # 3572A5 blue
              "CashPilot",                # 0A0A1A brand navy + sunset mark
              "Telegram",                 # 06489C deep blue
              "Swift",                    # F05138 red-orange
              "VPN Bypass",               # 152A4E navy + bypass lanes
              "LynxPrompt",               # 2B292C dark grey + official lynx
              "Networking",               # 4A6D1F olive + linked nodes
              "ElectroBun",               # 111111 black
              "TypeScript",               # 3178C6 blue
              "Pumperly",                 # 0C111B near-black + green bolt tile
              "GenieACS",                 # 67B028 beluga green + beluga
              "Audio",                    # 630075 plum + sound wave
              "Shell",                    # 89e051 green
              "Duplicacy",                # 12151C dark + level meter
              "Go",                       # 00ADD8 cyan
              "Radares Anunciados",       # 111318 near-black + yellow pin tile
              "Web Archive",              # 671700 rust brown + Internet Archive
              "Super bots",               # 1D3A32 dark green + each bot's own logo
              "CLI",                      # 007A6E teal + terminal
              "JavaScript",               # 1A7100 deep green
              "Biblical Atlas",           # 5C3D1E leather brown + open book
              "Genealogy",                # 8A6836 ochre + family tree
              # Platform integrations (contrast-ordered)
              "Jellyfin",                 # AA5CC3 purple
              "n8n",                      # EA4B71 pink
              "Home Assistant",           # 18BCF2 light blue
              "MCP",                      # 8B5CF6 purple
              "Agent Skills",             # 0F3B3D teal
              "Claude Code",              # D97757 terracotta
              "Android",                  # 34A853 green
              # App stores & templates
              "Unraid",                   # F15A2C orange
              # Infrastructure
              "Kubernetes",               # 326CE5 blue
              "Runtipi",                  # 27B648 green
              "Grafana",                  # F46800 orange
              "Docker",                   # 384d54 dark
              "Ghost",                    # 15171A dark
              # Dev tools (contrast-ordered)
              "VS Code",                  # 007ACC blue
              "Ansible",                  # EE0000 red
              "Awesome",                  # FC60A8 pink
              "GitHub Actions",           # 2088FF blue
              "Homebrew",                 # FBB040 yellow
              # IoT
              "Raspberry Pi",             # A22846 magenta
              # Remaining languages / fallback
              "R",
              "Browser Extensions",       # 4E00A9 Firefox violet
              "C#", "HTML", "Handlebars", "GitHub",
          ]

          # ── Group repos ────────────────────────────────────────────────
          groups = defaultdict(list)
          for r in repos:
              groups[get_group(r)].append(r)

          # Merge tiny language groups into closest match
          for tiny in ["Go Template", "Makefile"]:
              if tiny in groups and len(groups[tiny]) <= 2:
                  groups["Go"].extend(groups.pop(tiny))

          # Sort repos within each group: stars desc, then name asc
          for g in groups:
              groups[g].sort(key=lambda x: (x.get("isArchived", False), -x["stargazerCount"], x["name"].lower()))

          # Build ordered list: fixed order first, then new groups alphabetically
          ordered = []
          seen = set()
          for g in GROUP_ORDER:
              if g in groups:
                  ordered.append((g, groups[g]))
                  seen.add(g)
          for g in sorted(groups.keys()):
              if g not in seen:
                  ordered.append((g, groups[g]))

          def make_badge(repo, group):
              name = repo["name"]
              count = repo["stargazerCount"]
              color, logo = GROUP_STYLES.get(group, DEFAULT_STYLE)
              logo = REPO_LOGOS.get(name, logo)
              label = name.replace("-", "--")
              alt = name

              if repo.get("isArchived"):
                  alt = f"{name} (archived)"
              if repo.get("isArchived") and count >= 1:
                  src = f"https://img.shields.io/badge/{label}-☆_{count}-{ARCHIVED_STAR_COLOR}?style=flat-square&logo={logo}&logoColor=white&labelColor={color}"
              elif count >= 1:
                  src = f"https://img.shields.io/badge/{label}-★_{count}-{star_color(count, color, TOP_STARS)}?style=flat-square&logo={logo}&logoColor=white&labelColor={color}"
              else:
                  src = f"https://img.shields.io/badge/{label}-{color}?style=flat-square&logo={logo}&logoColor=white"

              if repo.get("isArchived") and re.fullmatch(r"[0-9A-Fa-f]{6}", color):
                  src = fade_badge(name, src, color)

              return f'<a href="https://github.com/GeiserX/{name}"><img src="{src}" alt="{alt}"></a>'

          badge_groups = []
          for group, repos_list in ordered:
              badges = [make_badge(r, group) for r in repos_list]
              badge_groups.append("\n".join(badges))

          for stale in set(os.listdir(FADE_DIR)) - faded:
              os.remove(os.path.join(FADE_DIR, stale))

          new_block = "\n<br/>\n".join(badge_groups)

          with open("README.md") as f:
              content = f.read()

          pm = re.search(
              r'(## Projects\s*\n+<p align="center">\n)(.*?)(\n</p>)',
              content, re.DOTALL
          )
          if not pm:
              print("No Projects section found")
              exit(0)

          new_content = content[:pm.start()] + pm.group(1) + new_block + pm.group(3) + content[pm.end():]

          if new_content != content:
              with open("README.md", "w") as f:
                  f.write(new_content)
              print("README updated")
          else:
              print("No changes needed")

      - uses: peter-evans/create-pull-request@v8
        id: create-pr
        with:
          commit-message: "Update star badges"
          title: "Update star badges"
          body: "Automated hourly update of star count badges in profile README."
          branch: automated/star-badges
          delete-branch: true

      - name: Merge PR
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # An explicit subject and body keep GitHub from adding a Co-authored-by trailer to the squash commit.
        run: >-
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --squash --delete-branch
          --subject "Update star badges (#${{ steps.create-pr.outputs.pull-request-number }})"
          --body "Automated update of the star badges in the profile README."
